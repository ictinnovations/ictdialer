name: Docker

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: docker.io/ictinnovations/ictdialer

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ictdialer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the container
        run: |
          docker run -d --name ictdialer-ci \
            -e ICTCORE_HOST=127.0.0.1 \
            -e FS_ESL_PASSWORD=ci-smoke-test \
            -p 8080:80 \
            ictdialer:ci

      # Poll on a short interval and bail as soon as the container dies. httpd
      # refuses to start on any config error, so on failure print the config
      # test and the process table. Between them they name the cause, which a
      # bare timeout does not.
      - name: Wait for the dashboard
        run: |
          for i in $(seq 1 48); do
            if curl -fsS http://127.0.0.1:8080/ | grep -qi '<ngx-app'; then
              echo "dashboard served after $((i * 5))s"; exit 0
            fi
            if [ -z "$(docker ps -q -f name=ictdialer-ci -f status=running)" ]; then
              echo "container is no longer running"; break
            fi
            sleep 5
          done
          echo "--- httpd -t ---"
          docker exec ictdialer-ci httpd -t || true
          echo "--- supervisorctl status ---"
          docker exec ictdialer-ci supervisorctl status || true
          echo "dashboard never appeared"; exit 1

      # An unrouted GET /api/ answers 404 by design. A 500 means PHP fatalled,
      # and by far the most common reason is the database, so probe it too.
      - name: Check the API is still reachable behind the GUI
        run: |
          code=$(curl -s -o /tmp/api.out -w '%{http_code}' http://127.0.0.1:8080/api/)
          echo "api returned $code"
          if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then exit 0; fi
          echo "--- response body ---"; head -c 2000 /tmp/api.out; echo
          echo "--- mariadb over tcp ---"
          docker exec ictdialer-ci mysqladmin -h 127.0.0.1 -P 3306 -u root ping || true
          exit 1

      - name: Check an Angular deep link falls back to index.html
        run: curl -fsS http://127.0.0.1:8080/pages/campaign/list | grep -qi '<ngx-app'

      # A dialer that boots without FreeSWITCH is a dialer that cannot dial, so
      # wait for the switch and confirm mod_sofia came up with it.
      - name: Check FreeSWITCH is up with mod_sofia loaded
        run: |
          for i in $(seq 1 30); do
            if docker exec ictdialer-ci fs_cli -p ci-smoke-test -x 'show modules' 2>/dev/null | grep -q mod_sofia; then
              echo "mod_sofia loaded after ${i}0s"; exit 0
            fi
            sleep 10
          done
          docker exec ictdialer-ci fs_cli -p ci-smoke-test -x 'show modules' || true
          echo "mod_sofia never loaded"; exit 1

      - name: Check the schema loaded
        run: docker exec ictdialer-ci mysql -N -B -e "SELECT COUNT(*) FROM ictfax.account"

      - name: Container logs
        if: always()
        run: docker logs ictdialer-ci

      - name: Tear down
        if: always()
        run: docker rm -f ictdialer-ci

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=ictdialer
            org.opencontainers.image.description=Open source voice and fax broadcasting dialer built on FreeSWITCH and ICTCore. Not the ictdialer.com hosted service.
            org.opencontainers.image.vendor=ICT Innovations
            org.opencontainers.image.url=https://github.com/ictinnovations/ictdialer

      - uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request'
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
